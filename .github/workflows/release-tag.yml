name: Tag Release

on:
  push:
    branches: [main]
    paths:
      - 'elastic/.cursor-plugin/plugin.json'

permissions:
  contents: write

jobs:
  tag:
    name: Tag and Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Extract version and check for changes
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          version=$(jq -r '.version' elastic/.cursor-plugin/plugin.json)
          name=$(jq -r '.name' elastic/.cursor-plugin/plugin.json)
          tag="${name}--v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          prev_version=$(git show "${BEFORE_SHA}:elastic/.cursor-plugin/plugin.json" 2>/dev/null | jq -r '.version' 2>/dev/null || echo "")
          if [ "$version" = "$prev_version" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if tag already exists
        if: steps.version.outputs.changed == 'true'
        id: tag-check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create git tag
        if: steps.version.outputs.changed == 'true' && steps.tag-check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true' && steps.tag-check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "v${VERSION}" \
            --generate-notes
